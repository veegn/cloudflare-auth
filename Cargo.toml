[package]
name = "cloudflare-auth"
version = "0.3.0"
edition = "2021"
description = "Cloudflare Workers auth service (Rust)"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
worker = { version = "0.8.6", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
