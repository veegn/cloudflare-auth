name = "cloudflare-auth"
main = "build/worker/shim.mjs"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "auth.dayti.de", custom_domain = true }
]

[build]
command = "worker-build --release"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
APP_NAME = "cloudflare-auth"
SERVICE_URL = "https://auth.dayti.de"
TOKEN_TTL_SECONDS = "86400"
ALLOW_REGISTRATION = "true"
PASSWORD_MIN_LENGTH = "8"
USERNAME_MIN = "3"
USERNAME_MAX = "32"
REQUIRE_APP_CREDENTIALS = "false"
APP_NAME_MAX = "64"
APP_DESC_MAX = "256"
PBKDF2_ITERATIONS = "100000"

[[d1_databases]]
binding = "DB"
database_name = "cloudflare-auth-db"
database_id = "be482cc2-c89f-4cc4-8c39-4292294fad2b"
